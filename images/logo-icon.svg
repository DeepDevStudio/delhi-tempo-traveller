<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Delhi Tempo Traveller on Rent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#d00000"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="3" y1="26" x2="7" y2="26"/>
    <line x1="2" y1="31" x2="7" y2="31"/>
    <line x1="4" y1="36" x2="7" y2="36"/>
  </g>
  <!-- van body -->
  <path d="M12 19 H41 Q43.5 19 45.2 20.8 L51.5 27.5 L55 29 Q57.5 30.2 57.5 33 V41 Q57.5 43.5 55 43.5 H11.5 Q9 43.5 9 41 V22 Q9 19 12 19 Z" fill="#ffffff"/>
  <!-- windows -->
  <g fill="#e85d04">
    <rect x="13" y="23" width="7.5" height="6.5" rx="1.5"/>
    <rect x="22.5" y="23" width="7.5" height="6.5" rx="1.5"/>
    <rect x="32" y="23" width="7.5" height="6.5" rx="1.5"/>
    <path d="M41.5 23 H43.4 L49.6 29.5 H41.5 Z"/>
  </g>
  <!-- side stripe -->
  <rect x="9" y="34" width="48.5" height="2.2" fill="#f97316"/>
  <!-- wheels -->
  <g>
    <circle cx="20" cy="44" r="5.6" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
    <circle cx="20" cy="44" r="2" fill="#ffffff"/>
    <circle cx="47" cy="44" r="5.6" fill="#1f2937" stroke="#ffffff" stroke-width="2"/>
    <circle cx="47" cy="44" r="2" fill="#ffffff"/>
  </g>
  <!-- road -->
  <rect x="12" y="52" width="40" height="2" rx="1" fill="#ffffff" opacity="0.35"/>
</svg>
